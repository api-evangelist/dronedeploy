  tags:
  - Maps
  - Exports
  - Reality Capture
  - GraphQL
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer-docs.dronedeploy.com/api/examples/creating-an-export
  baseURL: https://www.dronedeploy.com/graphql
  properties:

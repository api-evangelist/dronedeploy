    type: GraphQL
  - url: graphql/dronedeploy-schema.graphql
    type: GraphQL
  - url: collections/dronedeploy.postman_collection.json
    type: PostmanCollection
  - url: collections/dronedeploy.opencollection.json
    type: OpenCollection
  description: Generate and retrieve map exports from a MapPlan. The confirmed
    `createExport(input CreateExportInput!)` mutation takes a planId plus parameters
    (layer required; projection, merge, contourInterval, fileFormat, resolution, and an
    optional completion webhook) and returns an export id; `MapPlan.exports` returns
    export status, dateCreation, and downloadPath once processing reaches COMPLETE.

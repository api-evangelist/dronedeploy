  description: Query the projects and plans (MapPlan) in an organization through
    `viewer.organization.plans`/`projects` and the `node(id)` lookup - reading name,
    location and geometry (lat/lng), dateCreation, imageCount, and processing status -
    with cursor-based pagination. Plan/project creation and update mutations are
    modeled from the schema's MutationRoot.

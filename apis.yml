aid: dronedeploy
url: https://raw.githubusercontent.com/api-evangelist/dronedeploy/refs/heads/main/apis.yml
name: DroneDeploy
kind: company
description: DroneDeploy is a drone mapping, reality capture, and aerial analytics
  platform for construction, energy, agriculture, and inspection. Its developer
  platform is a GraphQL API (endpoint https://www.dronedeploy.com/graphql) that lets
  Enterprise and Developer Partner accounts query and mutate DroneDeploy data -
  organizations, projects, map plans, exports, annotations/issues, images, and
  webhooks - using a single strongly typed, Relay-style (cursor-paginated) schema
  rooted at the `viewer` object. A set of legacy REST APIs (Map Processing / Map
  Engine as a Service, Plan API, Export API) also remains available, but DroneDeploy
  recommends the GraphQL API for most integrations.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Drone Mapping
- Reality Capture
- Aerial Analytics
- Geospatial
- GraphQL
- Photogrammetry
created: '2026-07-04'
modified: '2026-07-04'
specificationVersion: '0.19'

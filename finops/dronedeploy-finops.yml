meters:
- name: seats
  description: Per-user subscription seats (Individual or Advanced tier), the primary billed unit.
  unit: seats
  aggregation: sum
  dimensions:
  - account
  - plan
- name: processing_volume
  description: Map processing volume metered in Gigapixels against the annual plan allowance.
  unit: gigapixels
  aggregation: sum
  dimensions:
  - account
  - project
- name: images_processed
  description: Source images ingested and processed into maps; bounded per map by plan tier.
  unit: images
  aggregation: sum
  dimensions:
  - account
  - plan
- name: exports_generated
  description: Map/report exports produced via the API or app; work is asynchronous and draws on processing capacity.
  unit: exports
  aggregation: sum
  dimensions:
  - account
  - plan
principles:
- name: Visibility
  description: Track seats in use, Gigapixels processed, and images per map against plan allowances; API usage itself is not separately metered.
- name: Allocation
  description: Map seats and projects to teams/sites so processing volume and seat cost map to internal cost centers.
- name: Optimization
  description: Right-size seat counts and tiers, batch imagery to stay within images-per-map and Gigapixel allowances, and export only the layers you need.
- name: Accountability
  description: Assign owners per project/organization; review annual seat and processing commitments against actual capture volume before renewal.

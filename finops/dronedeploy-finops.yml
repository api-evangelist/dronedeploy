description: >-
  FinOps view of DroneDeploy spend. DroneDeploy is a subscription SaaS billed
  primarily per seat (Individual and Advanced tiers) with processing metered by
  imagery volume (images per map, annual Gigapixels). The developer GraphQL API
  carries no separate per-call fee - it is an entitlement of an Enterprise or
  Developer Partner agreement, so its cost is bundled into the negotiated contract.
  The dominant cost drivers are the number of seats, the map processing volume
  (Gigapixels), and any premium capability tiers.
notes: >-
  Per-unit processing rates and enterprise contract pricing are not reconciled here;
  verify on the DroneDeploy pricing page and with Sales. There is no metered API usage
  charge documented - API access is gated by contract, not billed per request.
